name: Sync Backloggd Calendar

on:
  # schedule:
  #   # Runs every 8 hours (05:00 UTC = 12:00 AM CDT, 13:00 UTC = 08:00 AM CDT, 21:00 UTC = 04:00 PM CDT)
  #   - cron: '0 5,13,21 * * *'
  workflow_dispatch:
    inputs:
      username:
        description: 'Backloggd Username (leave empty to use secret/variable)'
        required: false
        type: string
      days_back:
        description: 'Days in the past to include'
        required: false
        default: '30'
        type: string
      sync_google:
        description: 'Sync to Google Calendar'
        required: false
        default: false
        type: boolean
      include_extras:
        description: 'Include Extras (DLC, Expansions, etc.)'
        required: false
        default: true
        type: boolean
      list_types:
        description: 'Comma-separated Backloggd list types (e.g. wishlist, backlog)'
        required: false
        default: 'wishlist'
        type: string

concurrency:
  group: sync-backloggd-calendar
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    name: Sync Calendar & Generate iCal
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.3'

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "requirements.txt"

      - name: Install Python Dependencies
        run: |
          uv pip install --system --require-hashes -r requirements.txt

      - name: Get Playwright Version
        id: playwright-version
        run: |
          VERSION=$(grep -E '^playwright==' requirements.txt | cut -d'=' -f3 | tr -d ' \\')
          echo "version=${VERSION:-latest}" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Browsers & OS Dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install chromium --with-deps

      - name: Install Playwright OS Dependencies Only (Cache Hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: playwright install-deps chromium

      - name: Setup Google Service Account (if provided)
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
        if: env.SERVICE_ACCOUNT_JSON != ''
        run: |
          echo "$SERVICE_ACCOUNT_JSON" > service_account.json

      - name: Generate iCal Calendar & Sync to Google
        env:
          BACKLOGGD_USERNAME: ${{ inputs.username || secrets.BACKLOGGD_USERNAME }}
          DAYS_BACK: ${{ inputs.days_back || secrets.DAYS_BACK || '30' }}
          SYNC_GOOGLE: ${{ inputs.sync_google || secrets.SYNC_GOOGLE || 'false' }}
          GOOGLE_SHARE_EMAIL: ${{ secrets.GOOGLE_SHARE_EMAIL }}
          INCLUDE_EXTRAS: ${{ inputs.include_extras || 'true' }}
          BACKLOGGD_LIST_TYPES: ${{ inputs.list_types || 'wishlist' }}
        run: |
          python generate_ical.py

      - name: Generate Job Summary
        if: always()
        run: |
          echo "## 📅 Backloggd Calendar Sync Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Trigger** | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Target User** | \`${{ inputs.username || secrets.BACKLOGGD_USERNAME }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Days Back** | ${{ inputs.days_back || secrets.DAYS_BACK || '30' }} days |" >> $GITHUB_STEP_SUMMARY
          echo "| **Google Sync Enabled** | \`${{ inputs.sync_google || secrets.SYNC_GOOGLE || 'false' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if ls ./*.ics 1> /dev/null 2>&1; then
            echo "✅ iCal file(s) generated successfully:" >> $GITHUB_STEP_SUMMARY
            ls -lh ./*.ics | awk '{print "- " $9 " (" $5 ")"}' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload iCal Files as Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backloggd-ical-files
          path: '*.ics'
          retention-days: 14
