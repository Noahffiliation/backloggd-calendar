[project]
name = "backloggd-calendar"
version = "0.1.0"
description = "Sync video game release dates from Backloggd to iCal and Google Calendar"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "google-api-python-client>=2.150.0",
    "google-auth>=2.30.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.0",
    "icalendar>=6.0.0",
    "playwright>=1.40.0",
    "python-dateutil>=2.9.0",
    "python-dotenv>=1.0.0",
    "urllib3>=2.0.0",
]

[dependency-groups]
dev = [
    "mypy>=1.11.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # Pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "UP",    # pyupgrade
    "SIM",   # flake8-simplify
    "RUF",   # Ruff-specific rules
]
ignore = [
    "E501",   # Line too long (handled by formatter)
    "BLE001", # Blind exception catching (needed for Playwright scraping and network retries)
    "B904",   # Exception chaining (clean domain exceptions for calendar sync)
]

[tool.ruff.lint.isort]
known-first-party = ["backloggd_client", "generate_ical", "google_sync", "ical_builder"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true
